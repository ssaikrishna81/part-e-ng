version: '3.8'

services:
  portal:
    image: node:20-alpine
    working_dir: /workspace
    command: >-
      sh -c "npm ci || npm install && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - type: bind
        source: .
        target: /workspace
      - portal-node-modules:/workspace/node_modules

  opal:
    image: node:20-alpine
    working_dir: /workspace
    profiles: ["opal"]
    command: >-
      sh -c "npm ci || npm install && npm run start -- --host 0.0.0.0 --port 5631"
    ports:
      - "5631:5631"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - type: bind
        source: ./opal
        target: /workspace
      - opal-node-modules:/workspace/node_modules

  vaccination:
    image: node:20-alpine
    working_dir: /workspace
    profiles: ["vaccination"]
    command: >-
      sh -c "npm ci || npm install && npm run start -- --host 0.0.0.0 --port 5632"
    ports:
      - "5632:5632"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - type: bind
        source: ./vaccination
        target: /workspace
      - vaccination-node-modules:/workspace/node_modules

  water:
    image: node:20-alpine
    working_dir: /workspace
    profiles: ["water"]
    command: >-
      sh -c "npm ci || npm install && npm run start -- --host 0.0.0.0 --port 5633"
    ports:
      - "5633:5633"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - type: bind
        source: ./water
        target: /workspace
      - water-node-modules:/workspace/node_modules

volumes:
  portal-node-modules:
  opal-node-modules:
  vaccination-node-modules:
  water-node-modules:
