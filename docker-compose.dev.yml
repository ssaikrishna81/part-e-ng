version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5633:5633"
    volumes:
      - ./:/app:cached
      - water_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start

volumes:
  water_node_modules:
