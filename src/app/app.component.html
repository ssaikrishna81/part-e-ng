<header class="topbar" *ngIf="!onLoginPage">
  <h1><i>ServiceUniverse</i></h1>
  <nav class="nav-links">
  <a href="#" (click)="goHome(); $event.preventDefault()" [class.active]="currentRoute === '/home' && !selectedService">Home</a>
    <!-- Service links open the selected service inside the portal (embedded area) -->
  <a href="#" (click)="openEmbedded('opal'); $event.preventDefault()" [class.active]="isActive('opal')">Opal</a>
  <a href="#" (click)="openEmbedded('vaccine'); $event.preventDefault()" [class.active]="isActive('vaccine')">Vaccine</a>
  <a href="#" (click)="openEmbedded('water'); $event.preventDefault()" [class.active]="isActive('water')">Water</a>
  </nav>
  <button class="logout-btn" (click)="logout()">Logout</button>
</header>

<router-outlet></router-outlet>
<app-dialog-host></app-dialog-host>
