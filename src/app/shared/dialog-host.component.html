<ng-container *ngIf="svc.state() as s">
  <div class="dialog-backdrop" (click)="onBackdropClick()"></div>

  <div class="dialog" role="dialog" aria-modal="true">
    <h3 class="dialog-title">{{ s.title }}</h3>

    <div class="dialog-body">
      <div *ngIf="s.html" [innerHTML]="s.html"></div>
      <ng-container *ngIf="!s.html">
        <p *ngIf="s.message">{{ s.message }}</p>
        <ng-container *ngIf="s.lines?.length">
          <p *ngFor="let line of s.lines">{{ line }}</p>
        </ng-container>
        <img *ngIf="s.imageUrl" [src]="s.imageUrl" alt="Help image" class="dialog-image">
      </ng-container>
    </div>

    <div class="dialog-actions">
      <button
        *ngFor="let b of (s.buttons ?? defaultButtons)"
        (click)="onButton(b.value)"
        [class.primary]="b.role === 'primary'">
        {{ b.text }}
      </button>
    </div>
  </div>
</ng-container>
